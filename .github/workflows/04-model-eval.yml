name: 04 - Model Evaluation

on:
  workflow_run:
    workflows: ["03 - Model Training (SageMaker)"]
    types: [completed]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}

jobs:
  evaluate:
    runs-on: ubuntu-latest

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install boto3 pandas numpy torch transformers scikit-learn matplotlib seaborn

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run evaluation
        run: |
          python src/model_eval.py \
            --bucket ${{ env.S3_BUCKET }} \
            --project ${{ env.PROJECT_NAME }} \
            --region ${{ env.AWS_REGION }} \
            --model-uri ${{ github.event.workflow_run.outputs.model-s3-uri }} \
            --output-path /tmp/evaluation

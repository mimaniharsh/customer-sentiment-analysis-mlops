name: 04 - Model Evaluation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["03 - Model Training"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  evaluate-model:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install boto3 pandas numpy scikit-learn torch transformers matplotlib seaborn
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Evaluate model
        run: |
          # Use vars and env to ensure the script gets the right paths
          python src/model_eval.py \
            --bucket ${{ vars.S3_BUCKET }} \
            --project ${{ vars.PROJECT_NAME }} \
            --region ${{ vars.AWS_REGION }} \
            --output-path /tmp/evaluation
      
      - name: Download and display results
        run: |
          aws s3 cp s3://${{ vars.S3_BUCKET }}/${{ vars.PROJECT_NAME }}/evaluation/evaluation_results.json ./
          echo "📊 Evaluation Metrics:"
          cat evaluation_results.json | python -m json.tool
      
      - name: Create summary
        run: |
          echo "## ✅ Model Evaluation Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Test Metrics" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat evaluation_results.json >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 Visualizations" >> $GITHUB_STEP_SUMMARY
          echo "- Confusion Matrix: s3://${{ vars.S3_BUCKET }}/customer-sentiment-analysis-mlops/evaluation/confusion_matrix.png" >> $GITHUB_STEP_SUMMARY

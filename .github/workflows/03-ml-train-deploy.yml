name: ML — Train & Deploy SageMaker Model

on:
  workflow_dispatch:
    inputs:
      aws_region:
        description: "AWS Region (e.g. ap-south-1)"
        required: false
        default: "ap-south-1"
      epochs:
        description: "Training epochs"
        required: false
        default: "10"
      batch_size:
        description: "Batch size"
        required: false
        default: "32"
      deploy_after_train:
        description: "Deploy to endpoint after training?"
        required: false
        default: "true"
        type: boolean

jobs:
  preprocess:
    name: Data Preprocessing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3 pandas scikit-learn kagglehub

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Download dataset from Kaggle & upload to S3
        run: |
          python packages/ml/pipeline/data_download.py \
            --bucket ${{ secrets.S3_BUCKET }} \
            --project ${{ secrets.PROJECT_NAME }} \
            --region ${{ github.event.inputs.aws_region }}
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}

      - name: Preprocess & split data
        run: |
          python packages/ml/pipeline/data_preprocess.py \
            --bucket ${{ secrets.S3_BUCKET }} \
            --project ${{ secrets.PROJECT_NAME }} \
            --region ${{ github.event.inputs.aws_region }}

  train:
    name: SageMaker Training
    runs-on: ubuntu-latest
    needs: preprocess
    outputs:
      job-name: ${{ steps.start.outputs.job_name }}
      model-uri: ${{ steps.artifacts.outputs.model_uri }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3 sagemaker

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Package training code & upload to S3
        run: |
          cp packages/ml/training/model_train.py model_train.py
          printf "torch==2.3.1\ntransformers==4.44.2\nscikit-learn==1.5.1\npandas==2.2.2\n" > requirements.txt
          tar -czf sourcedir.tar.gz model_train.py requirements.txt
          aws s3 cp sourcedir.tar.gz s3://${{ secrets.S3_BUCKET }}/${{ secrets.PROJECT_NAME }}/code/sourcedir.tar.gz

      - name: Launch SageMaker training job
        id: start
        env:
          AWS_REGION_INPUT: ${{ github.event.inputs.aws_region }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
          SAGEMAKER_ROLE_ARN: ${{ secrets.SAGEMAKER_ROLE_ARN }}
          EPOCHS: ${{ github.event.inputs.epochs }}
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          JOB_NAME="${PROJECT_NAME}-train-${TIMESTAMP}"
          echo "job_name=${JOB_NAME}" >> $GITHUB_OUTPUT

          python - << PYEOF
          import boto3, os
          region = os.environ['AWS_REGION_INPUT']
          bucket = os.environ['S3_BUCKET']
          project = os.environ['PROJECT_NAME']
          role = os.environ['SAGEMAKER_ROLE_ARN']
          epochs = os.environ['EPOCHS']
          batch_size = os.environ['BATCH_SIZE']
          job_name = os.environ.get('JOB_NAME', '')

          import subprocess
          result = subprocess.run(['bash', '-c', 'echo $JOB_NAME'], capture_output=True, text=True)

          sm = boto3.client('sagemaker', region_name=region)
          sm.create_training_job(
            TrainingJobName='${JOB_NAME}',
            RoleArn=role,
            AlgorithmSpecification={
              'TrainingImage': f'763104351884.dkr.ecr.{region}.amazonaws.com/pytorch-training:2.3.0-gpu-py311-cu121-ubuntu20.04-sagemaker-v1.0',
              'TrainingInputMode': 'File'
            },
            InputDataConfig=[{
              'ChannelName': 'training',
              'DataSource': {'S3DataSource': {
                'S3DataType': 'S3Prefix',
                'S3Uri': f's3://{bucket}/{project}/data/processed/'
              }}
            }],
            OutputDataConfig={
              'S3OutputPath': f's3://{bucket}/{project}/models/'
            },
            ResourceConfig={
              'InstanceType': 'ml.g4dn.xlarge',
              'InstanceCount': 1,
              'VolumeSizeInGB': 30
            },
            StoppingCondition={'MaxRuntimeInSeconds': 3600},
            HyperParameters={
              'bucket': bucket,
              'project': project,
              'region': region,
              'epochs': epochs,
              'batch-size': batch_size,
              'sagemaker_program': 'model_train.py',
              'sagemaker_submit_directory': f's3://{bucket}/{project}/code/sourcedir.tar.gz'
            }
          )
          print(f'Launched: ${JOB_NAME}')
          PYEOF

      - name: Wait for training to complete
        env:
          AWS_REGION_INPUT: ${{ github.event.inputs.aws_region }}
        run: |
          python - << 'PYEOF'
          import boto3, time, os
          sm = boto3.client('sagemaker', region_name=os.environ['AWS_REGION_INPUT'])
          job = '${{ steps.start.outputs.job_name }}'
          print(f'Waiting for: {job}')
          while True:
            resp = sm.describe_training_job(TrainingJobName=job)
            status = resp['TrainingJobStatus']
            print(f'  Status: {status}')
            if status == 'Completed':
              print('Done!')
              break
            if status in ('Failed', 'Stopped'):
              raise RuntimeError(f"Training {status}: {resp.get('FailureReason', '')}")
            time.sleep(30)
          PYEOF

      - name: Get model artifact URI
        id: artifacts
        run: |
          URI=$(aws sagemaker describe-training-job \
            --training-job-name ${{ steps.start.outputs.job_name }} \
            --query 'ModelArtifacts.S3ModelArtifacts' \
            --output text)
          echo "model_uri=${URI}" >> $GITHUB_OUTPUT
          echo "Model: ${URI}"

  evaluate:
    name: Evaluate Model
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3 torch transformers scikit-learn pandas matplotlib seaborn

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Run evaluation
        run: |
          python packages/ml/evaluation/model_eval.py \
            --bucket ${{ secrets.S3_BUCKET }} \
            --project ${{ secrets.PROJECT_NAME }} \
            --region ${{ github.event.inputs.aws_region }} \
            --output-path ./eval-results

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: eval-results/

  deploy:
    name: Deploy to SageMaker Endpoint
    runs-on: ubuntu-latest
    needs: [train, evaluate]
    if: ${{ github.event.inputs.deploy_after_train == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install boto3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ github.event.inputs.aws_region }}

      - name: Deploy model to endpoint
        run: |
          python packages/ml/serving/model_deploy.py \
            --bucket ${{ secrets.S3_BUCKET }} \
            --project ${{ secrets.PROJECT_NAME }} \
            --endpoint ${{ secrets.SAGEMAKER_ENDPOINT_NAME }} \
            --role ${{ secrets.SAGEMAKER_ROLE_ARN }} \
            --region ${{ github.event.inputs.aws_region }}

      - name: Summary
        run: |
          echo "## ML Pipeline Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Model URI:** ${{ needs.train.outputs.model-uri }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Endpoint:** ${{ secrets.SAGEMAKER_ENDPOINT_NAME }}" >> $GITHUB_STEP_SUMMARY

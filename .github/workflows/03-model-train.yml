name: 03 - Model Training

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["02 - Data Preprocessing"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  train-model:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install "transformers[torch]" boto3 pandas numpy scikit-learn jq

      ###########################################################
      # DEBUG 1 — Show GitHub Context Info
      ###########################################################
      - name: Debug GitHub Context
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Workflow: ${{ github.workflow }}"

      ###########################################################
      # DEBUG 2 — Print actual role ARN being assumed
      ###########################################################
      - name: Debug Role ARN
        run: |
          echo "Role to assume: ${{ secrets.SAGEMAKER_ROLE_ARN }}"

      ###########################################################
      # DEBUG 3 — Dump full OIDC token payload
      ###########################################################
      - name: Debug OIDC Token Payload
        run: |
          ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== ACTUAL OIDC CLAIMS FROM GITHUB ==="
          echo $ID_TOKEN | cut -d'.' -f2 | base64 -d -i | jq .
          echo "======================================"

      ###########################################################
      #DEBUG 4 — Show sub claim exactly as AWS sees it
      ###########################################################
      - name: Show OIDC Claim Details
        run: |
          echo "Expected sub:"
          echo "repo:${{ github.repository }}:ref:${{ github.ref }}"

      ###########################################################
      # AWS LOGIN STEP (your original)
      ###########################################################
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      ###########################################################
      #DEBUG 5 — Verify AWS identity after assume
      ###########################################################
      - name: Verify AWS Caller Identity
        run: aws sts get-caller-identity

      ###########################################################
      #DEBUG 6 — List bucket access test
      ###########################################################
      - name: Test S3 Access
        run: aws s3 ls || echo "S3 access failed"

      ###########################################################
      #YOUR ORIGINAL TRAIN STEP (unchanged)
      ###########################################################
      - name: Train model
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: python src/model_train.py

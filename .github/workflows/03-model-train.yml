name: 03 - Model Training (SageMaker)

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Number of epochs'
        required: false
        default: '10'
      batch_size:
        description: 'Batch size'
        required: false
        default: '32'

  # Auto-trigger after preprocessing completes
  workflow_run:
    workflows: ["02 - Data Preprocessing"]
    types: [completed]

  # Trigger on code changes
  push:
    branches:
      - master
    paths:
      - 'src/model_train.py'

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  S3_BUCKET: ${{ vars.S3_BUCKET }}
  PROJECT_NAME: ${{ vars.PROJECT_NAME }}
  SAGEMAKER_ROLE_ARN: ${{ secrets.SAGEMAKER_ROLE_ARN }}

jobs:
  train-model:
    name: Train Model on SageMaker
    runs-on: ubuntu-latest

    # Only run if preprocessing succeeded (for auto-trigger) or manually/push
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}

    permissions:
      id-token: write
      contents: read

    outputs:
      job-name: ${{ steps.start-training.outputs.job_name }}
      model-s3-uri: ${{ steps.get-model.outputs.model_uri }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate timestamp
        id: timestamp
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          echo "timestamp=$TIMESTAMP" >> $GITHUB_OUTPUT
          echo "Generated timestamp: $TIMESTAMP"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install boto3 sagemaker pandas numpy

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload script to S3
        run: |
          # Create the wrapper exactly as in your reference
          cat > train.py <<'EOF'
          import subprocess
          import sys
          # Call your original script as a separate process to ensure __main__ triggers
          subprocess.check_call([sys.executable, "model_train.py"] + sys.argv[1:])
          EOF

          # Copy script from src to root for flat packaging
          cp src/model_train.py .
          
          # Ensure dependencies are available inside the SageMaker container
          echo "torch==2.0.1" > requirements.txt
          echo "transformers==4.44.2" >> requirements.txt
          echo "accelerate>=0.21.0" >> requirements.txt
          echo "scikit-learn" >> requirements.txt

          
          tar -cvzf sourcedir.tar.gz train.py model_train.py requirements.txt
          aws s3 cp sourcedir.tar.gz s3://${{ env.S3_BUCKET }}/${{ env.PROJECT_NAME }}/code/sourcedir.tar.gz

      - name: Verify processed data
        run: |
          echo "Checking for processed data..."
          FILE_COUNT=$(aws s3 ls s3://${{ env.S3_BUCKET }}/${{ env.PROJECT_NAME }}/data/processed/ --recursive | wc -l)
          if [ $FILE_COUNT -lt 1 ]; then
            echo "No processed data found!"
            exit 1
          fi
          echo "Found data files."

      - name: Start SageMaker Training Job
        id: start-training
        run: |
          python - <<'EOF'
          import boto3
          import os
          
          sagemaker = boto3.client('sagemaker', region_name='${{ env.AWS_REGION }}')
          
          job_name = f"${{ env.PROJECT_NAME }}-train-${{ steps.timestamp.outputs.timestamp }}"
          
          sagemaker.create_training_job(
              TrainingJobName=job_name,
              RoleArn='${{ env.SAGEMAKER_ROLE_ARN }}',
              AlgorithmSpecification={
                  'TrainingImage': f'763104351884.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/pytorch-training:2.0.0-cpu-py310',
                  'TrainingInputMode': 'File'
              },
              InputDataConfig=[{
                  'ChannelName': 'training',
                  'DataSource': {
                      'S3DataSource': {
                          'S3DataType': 'S3Prefix',
                          'S3Uri': 's3://${{ env.S3_BUCKET }}/${{ env.PROJECT_NAME }}/data/processed/'
                      }
                  }
              }],
              OutputDataConfig={
                  'S3OutputPath': 's3://${{ env.S3_BUCKET }}/${{ env.PROJECT_NAME }}/models/'
              },
              ResourceConfig={
                  'InstanceType': 'ml.m5.xlarge',
                  'InstanceCount': 1,
                  'VolumeSizeInGB': 10
              },
              # Added back mandatory field
              StoppingCondition={
                  'MaxRuntimeInSeconds': 3600
              },
              HyperParameters={
                  'bucket': '${{ env.S3_BUCKET }}',
                  'project': '${{ env.PROJECT_NAME }}',
                  'region': '${{ env.AWS_REGION }}',
                  'epochs': '2',          # ⬅️ reduced
                  'batch-size': '16',     # ⬅️ reduced

                  'sagemaker_program': 'train.py',
                  'sagemaker_submit_directory': f"s3://${{ env.S3_BUCKET }}/${{ env.PROJECT_NAME }}/code/sourcedir.tar.gz"
              }
          )
          
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"job_name={job_name}\n")
          EOF

      - name: Wait for Training Job
        run: |
          python - <<'EOF'
          import boto3
          import time
          import os

          sagemaker = boto3.client('sagemaker', region_name='${{ env.AWS_REGION }}')
          job_name = "${{ steps.start-training.outputs.job_name }}"
          
          print(f"Waiting for training job: {job_name}")
          while True:
              response = sagemaker.describe_training_job(TrainingJobName=job_name)
              status = response['TrainingJobStatus']
              print(f"Status: {status}")
              
              if status == 'Completed':
                  break
              elif status in ['Failed', 'Stopped']:
                  print(f"Training job failed: {response.get('FailureReason', 'Unknown')}")
                  exit(1)
              time.sleep(30)
          EOF

      - name: Get model artifacts
        id: get-model
        run: |
          MODEL_URI=$(aws sagemaker describe-training-job \
            --training-job-name ${{ steps.start-training.outputs.job_name }} \
            --query 'ModelArtifacts.S3ModelArtifacts' --output text)
          echo "model_uri=$MODEL_URI" >> $GITHUB_OUTPUT

      - name: Create Summary
        run: |
          echo "## Model Training Complete ✓" >> $GITHUB_STEP_SUMMARY
          echo "- **Job Name:** \`${{ steps.start-training.outputs.job_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact Location:** ${{ steps.get-model.outputs.model_uri }}" >> $GITHUB_STEP_SUMMARY
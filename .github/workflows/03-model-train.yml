name: 03 - Model Training

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["02 - Data Preprocessing"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  train-model:
    runs-on: ubuntu-latest
    # Explicitly define permissions at the job level to ensure they carry over during workflow_run
    permissions:
      id-token: write
      contents: read
    
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install boto3 pandas numpy scikit-learn torch transformers
          
      - name: Debug OIDC Token Payload
        run: |
          ID_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "=== ACTUAL OIDC CLAIMS FROM GITHUB ==="
          echo $ID_TOKEN | cut -d'.' -f2 | base64 -d | jq .
          echo "======================================"
          
      - name: Show OIDC Claim Details
        run: |
          echo "The repo is: ${{ github.repository }}"
          echo "The sub claim being sent is: repo:${{ github.repository }}:ref:${{ github.ref }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SAGEMAKER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Train model
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: python src/model_train.py

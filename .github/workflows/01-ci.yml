name: CI — Build, Lint, Test, Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ─── Secret Scanning Safeguard ─────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect Hardcoded AWS Keys
        run: |
          echo "Scanning for hardcoded AWS key patterns..."
          if grep -rn "AKIA[0-9A-Z]\{16\}" --include="*.py" --include="*.ts" --include="*.js" --include="*.yml" --include="*.env" . | grep -v ".env.example" | grep -v ".gitignore"; then
            echo "❌ FATAL: Hardcoded AWS Access Key ID found in repository!"
            exit 1
          fi
          echo "✅ No hardcoded AWS keys found."

  # ─── Python Lint & Test ────────────────────────────────────────────────────
  python-ci:
    name: Python — Lint & Test
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install deps
        run: |
          cd apps/api
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio pytest-cov

      - name: Ruff lint
        run: ruff check apps/api/

      - name: Type check
        run: mypy apps/api/app/ --ignore-missing-imports --no-strict-optional || true

      - name: Run tests
        run: |
          cd apps/api
          pytest tests/ -v --tb=short --cov=app --cov-report=xml || true

  # ─── Frontend Build ────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Build & Lint
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install deps
        run: cd apps/web && npm ci

      - name: Type check
        run: cd apps/web && npm run type-check || true

      - name: Lint
        run: cd apps/web && npm run lint || true

      - name: Build
        run: cd apps/web && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_NAME: "Sentient Intelligence Platform"

  # ─── Docker Build Validation ───────────────────────────────────────────────
  docker-build:
    name: Docker — Validate Builds
    runs-on: ubuntu-latest
    needs: [python-ci, frontend-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI — Build, Lint, Test, Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ── Secret Scanning ───────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Hardcoded AWS Keys
        run: |
          echo "Scanning for hardcoded AWS key patterns..."
          if grep -rn "AKIA[0-9A-Z]\{16\}" \
            --include="*.py" --include="*.ts" --include="*.js" \
            --include="*.yml" --include="*.json" . \
            | grep -v ".env.example" | grep -v ".gitignore"; then
            echo "FATAL: Hardcoded AWS Access Key ID found!"
            exit 1
          fi
          echo "No hardcoded AWS keys found."

  # ── Python Lint & Test ────────────────────────────────────────────────────
  python-ci:
    name: Python — Lint & Test
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          cd apps/api
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio httpx

      - name: Lint
        run: ruff check apps/api/ || true

      - name: Run tests
        run: |
          cd apps/api
          pytest tests/ -v --tb=short || true

  # ── Frontend Build ────────────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Build
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd apps/web
          npm install --legacy-peer-deps

      - name: Build
        run: cd apps/web && npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_APP_NAME: "Sentient Intelligence Platform"

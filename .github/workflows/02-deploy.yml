name: CD — Deploy to Production

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

# This workflow deploys to ECS/ECR — only run this if you have
# ECS and ECR set up. For local/Codespaces use, skip this entirely.
# The ML workflow (03) is what you need to run the platform.

jobs:
  deploy:
    name: Deploy — ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: ${{ secrets.ECR_REGISTRY }}/sentient-api:${{ github.sha }}

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: ${{ secrets.ECR_REGISTRY }}/sentient-web:${{ github.sha }}
          build-args: NEXT_PUBLIC_API_URL=${{ secrets.API_PUBLIC_URL }}

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster ${{ secrets.ECS_CLUSTER }} --service sentient-api --force-new-deployment --region ${{ secrets.AWS_REGION }}
          aws ecs update-service --cluster ${{ secrets.ECS_CLUSTER }} --service sentient-web --force-new-deployment --region ${{ secrets.AWS_REGION }}

name: CD — Deploy to Production

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "docker-compose.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}

jobs:
  deploy:
    name: Deploy — ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    permissions:
      id-token: write    # Required for OIDC role assumption — no static keys!
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Uses IAM role assumed via GitHub OIDC — ZERO static credentials
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/sentient-api:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/sentient-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/sentient-web:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/sentient-web:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.API_PUBLIC_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy API to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service sentient-api \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Deploy Web to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service sentient-web \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

      - name: Wait for service stability
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services sentient-api sentient-web \
            --region ${{ env.AWS_REGION }}

      - name: Deployment summary
        run: |
          echo "## Deployment Complete ✅" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API Image:** \`${{ env.ECR_REGISTRY }}/sentient-api:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

name: 05 - Model Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["04 - Model Evaluation"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy-model:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install boto3 sagemaker
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      
      - name: Deploy model to SageMaker
        run: |
          python src/model_deploy.py \
            --bucket ${{ vars.S3_BUCKET }} \
            --project customer-sentiment-analysis-mlops \
            --endpoint ${{ vars.ENDPOINT_NAME }} \
            --role ${{ secrets.SAGEMAKER_ROLE_ARN }} \
            --region ap-south-1 \
            --output-file deployment_info.json
      
      - name: Test endpoint
        run: |
          ENDPOINT_NAME="${{ vars.ENDPOINT_NAME }}"
          TEST_TEXT="The flight was delayed by 3 hours and the staff was rude!"
          
          echo "🧪 Testing endpoint with sample text..."
          echo "Text: $TEST_TEXT"
          
          aws sagemaker-runtime invoke-endpoint \
            --endpoint-name "$ENDPOINT_NAME" \
            --content-type application/json \
            --body "{\"text\": \"$TEST_TEXT\"}" \
            --region ap-south-1 \
            response.json
          
          echo "📊 Prediction Result:"
          cat response.json | python -m json.tool
      
      - name: Create summary
        run: |
          echo "## ✅ Model Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Endpoint Details" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat deployment_info.json >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat response.json >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📝 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Make predictions using the endpoint" >> $GITHUB_STEP_SUMMARY
          echo "2. Monitor endpoint metrics in CloudWatch" >> $GITHUB_STEP_SUMMARY
          echo "3. Set up auto-scaling if needed" >> $GITHUB_STEP_SUMMARY
          echo "4. **Remember to delete endpoint when done to avoid costs!**" >> $GITHUB_STEP_SUMMARY

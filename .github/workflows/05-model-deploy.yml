name: 05 - Model Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["04 - Model Evaluation"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy-model:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install boto3 sagemaker
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Deploy model to SageMaker
        run: |
          python src/model_deploy.py \
            --bucket ${{ vars.S3_BUCKET }} \
            --project ${{ vars.PROJECT_NAME }} \
            --endpoint ${{ vars.ENDPOINT_NAME }} \
            --role ${{ secrets.SAGEMAKER_ROLE_ARN }} \
            --region ${{ vars.AWS_REGION }} \
            --output-file deployment_info.json
      
      - name: Test endpoint
        run: |
          echo "🧪 Testing endpoint..."
          TEST_TEXT="The flight was delayed and the staff was rude!"
          
          # Write the payload to a temporary file
          echo "{\"text\": \"$TEST_TEXT\"}" > payload.json
          
          # Use fileb:// to pass the payload exactly as-is
          aws sagemaker-runtime invoke-endpoint \
            --endpoint-name ${{ vars.ENDPOINT_NAME }} \
            --content-type application/json \
            --body fileb://payload.json \
            --region ${{ vars.AWS_REGION }} \
            response.json
          
          echo "📊 Prediction Result:"
          cat response.json | python -m json.tool
      
      - name: Create summary
        run: |
          echo "## ✅ Model Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Endpoint Details" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat deployment_info.json >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          cat response.json >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Important" >> $GITHUB_STEP_SUMMARY
          echo "Remember to delete the endpoint when done to avoid costs!" >> $GITHUB_STEP_SUMMARY
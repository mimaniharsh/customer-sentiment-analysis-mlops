name: 05 - Model Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["04 - Model Evaluation"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy-model:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install boto3 sagemaker
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SAGEMAKER_ROLE_ARN }}
          aws-region: ap-south-1
      
      - name: Deploy model to SageMaker
        run: |
          python src/model_deploy.py \
            --bucket ${{ vars.S3_BUCKET }} \
            --project customer-sentiment-analysis-mlops \
            --endpoint ${{ vars.ENDPOINT_NAME }} \
            --role ${{ secrets.SAGEMAKER_ROLE_ARN }} \
            --region ap-south-1

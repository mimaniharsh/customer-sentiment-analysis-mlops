name: 05 - Model Deployment

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["04 - Model Evaluation"]
    types:
      - completed

permissions:
  id-token: write
  contents: read

jobs:
  deploy-model:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install boto3 sagemaker
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.SAGEMAKER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      
      - name: Deploy model to SageMaker
        env:
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SAGEMAKER_ROLE_ARN: ${{ secrets.SAGEMAKER_ROLE_ARN }}
          ENDPOINT_NAME: ${{ vars.ENDPOINT_NAME }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
        run: python src/model_deploy.py
